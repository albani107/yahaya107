    <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple Text Editor</title>
<style>
  :root{
    --bg:#f7f7f8;
    --panel:#ffffff;
    --muted:#666;
    --accent:#2463eb;
    --toolbar:#f0f2f5;
    --border:#e3e6ea;
    --success:#2ea44f;
    --danger:#d73a49;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  [data-theme="dark"]{
    --bg:#0f1113;
    --panel:#111214;
    --muted:#9aa0a6;
    --accent:#5b8cff;
    --toolbar:#121416;
    --border:#202224;
    --success:#38c172;
    --danger:#ff6b6b;
  }

  html,body{height:100%;margin:0;background:var(--bg);color:var(--muted);}
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    gap:18px;
    padding:20px;
    box-sizing:border-box;
  }

  header{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .title-area{
    display:flex;
    gap:12px;
    align-items:center;
    flex:1;
  }
  input.title{
    font-size:18px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:inherit;
    min-width:180px;
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
  }
  .meta{
    display:flex;
    gap:8px;
    align-items:center;
    color:var(--muted);
    font-size:13px;
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
  }

  button.icon{
    background:var(--toolbar);
    border:1px solid var(--border);
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button.icon:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06);}

  .editor-wrap{
    display:flex;
    gap:18px;
    align-items:flex-start;
    width:100%;
  }

  .toolbar{
    flex:0 0 56px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .toolbar button{width:56px;height:56px;padding:8px;border-radius:12px;}

  .editor-panel{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 3px 12px rgba(12,14,16,0.03);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .top-toolbar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    align-items:center;
  }
  .top-toolbar .group{display:flex;gap:6px;align-items:center;}

  .content{
    padding:18px;
    min-height:360px;
    outline:none;
    line-height:1.6;
    color:var(--muted);
    overflow:auto;
  }
  .content:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
    opacity:0.6;
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:auto;
  }

  .status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;}
  .count{font-size:13px;color:var(--muted);}

  /* responsive */
  @media (max-width:760px){
    .toolbar{flex-direction:row;flex:0 0 auto;}
    .toolbar button{width:44px;height:44px;border-radius:10px;}
    .editor-wrap{flex-direction:column;}
  }

  /* small helpers */
  .small{font-size:13px;color:var(--muted)}
  input[type="file"]{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="title-area">
      <input class="title" id="docTitle" placeholder="Untitled document" aria-label="Document title" />
      <div class="meta small" id="savedMeta">No saved version</div>
    </div>

    <div class="controls">
      <label title="Toggle theme">
        <button class="icon" id="toggleTheme" aria-label="Toggle theme" title="Toggle theme">🌓</button>
      </label>

      <button class="icon" id="exportHtml" title="Export as HTML (Ctrl/Cmd+E)">⬇️ HTML</button>
      <button class="icon" id="exportTxt" title="Export as TXT (Ctrl/Cmd+T)">⬇️ TXT</button>

      <label for="importFile" class="icon" title="Import (.html or .txt)">
        📂 Import
      </label>
      <input type="file" id="importFile" accept=".html,.htm,.txt,text/html,text/plain" />

      <button class="icon" id="clearDoc" title="Clear document">🗑️</button>
    </div>
  </header>

  <main class="editor-wrap">
    <nav class="toolbar" aria-hidden="false" role="toolbar" aria-label="Formatting toolbar">
      <button class="icon" data-cmd="bold" title="Bold (Ctrl/Cmd+B)">B</button>
      <button class="icon" data-cmd="italic" title="Italic (Ctrl/Cmd+I)">I</button>
      <button class="icon" data-cmd="underline" title="Underline (Ctrl/Cmd+U)">U</button>

      <button class="icon" data-cmd="insertUnorderedList" title="Bullet list">•</button>
      <button class="icon" data-cmd="insertOrderedList" title="Numbered list">1.</button>

      <button class="icon" data-cmd="h2" title="Heading">H</button>
      <button class="icon" data-cmd="blockquote" title="Blockquote">❝</button>

      <button class="icon" data-cmd="createLink" title="Insert link">🔗</button>
      <button class="icon" id="insertImage" title="Insert image">🖼️</button>
      <input type="file" id="imageFile" accept="image/*" style="display:none" />
    </nav>

    <section class="editor-panel" >
      <div class="top-toolbar">
        <div class="group">
          <select id="fontSize" title="Font size">
            <option value="">Font size</option>
            <option value="14px">14px</option>
            <option value="16px" selected>16px</option>
            <option value="18px">18px</option>
            <option value="20px">20px</option>
            <option value="24px">24px</option>
          </select>

          <select id="fontFamily" title="Font family">
            <option value="">Font family</option>
            <option value="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial">Default</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Courier New, monospace">Monospace</option>
          </select>
        </div>

        <div class="group" style="margin-left:auto">
          <button class="icon" id="undo" title="Undo (Ctrl/Cmd+Z)">↺</button>
          <button class="icon" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↻</button>
        </div>
      </div>

      <div id="editor" class="content" contenteditable="true" data-placeholder="Start typing here..."></div>
    </section>
  </main>

  <footer>
    <div class="status">
      <div id="saveStatus">Autosave off</div>
      <div id="charCount" class="count">0 chars</div>
      <div id="wordCount" class="count">0 words</div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
      <div class="small">Shortcuts: <span style="color:var(--accent)">Ctrl/Cmd+S</span> save • <span style="color:var(--accent)">Ctrl/Cmd+E</span> export HTML</div>
    </div>
  </footer>
</div>

<script>
/*
  Simple Text Editor - Single-file static page
  Features:
  - contenteditable rich-text area
  - formatting toolbar (bold, italic, lists, headings, link, image)
  - autosave to localStorage (debounced)
  - export HTML / TXT
  - import HTML / TXT
  - undo/redo
  - word/character count
  - theme toggle (dark/light)
  - keyboard shortcuts
*/

(function(){
  const LS_KEY = 'simple_editor_v1';
  const LS_THEME = 'simple_editor_theme_v1';
  const docTitle = document.getElementById('docTitle');
  const editor = document.getElementById('editor');
  const saveStatus = document.getElementById('saveStatus');
  const savedMeta = document.getElementById('savedMeta');
  const charCount = document.getElementById('charCount');
  const wordCount = document.getElementById('wordCount');
  const toggleThemeBtn = document.getElementById('toggleTheme');

  // Load from localStorage
  function loadFromStorage(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (obj.title) docTitle.value = obj.title;
      if (obj.content) editor.innerHTML = obj.content;
      if (obj.updatedAt) savedMeta.textContent = 'Saved ' + new Date(obj.updatedAt).toLocaleString();
      updateCounts();
      updateSaveStatus('Loaded');
    }catch(e){
      console.error('Failed to load:', e);
    }
  }

  function saveToStorage(){
    const obj = {
      title: docTitle.value || 'Untitled document',
      content: editor.innerHTML,
      updatedAt: Date.now()
    };
    localStorage.setItem(LS_KEY, JSON.stringify(obj));
    savedMeta.textContent = 'Saved ' + new Date(obj.updatedAt).toLocaleString();
    updateSaveStatus('Saved');
  }

  // Debounce autosave
  let autosaveTimer = null;
  function scheduleAutosave(){
    updateSaveStatus('Saving...');
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(()=>{
      saveToStorage();
      autosaveTimer = null;
    }, 900);
  }

  function updateSaveStatus(text){
    saveStatus.textContent = text;
    if (text === 'Saved' || text === 'Loaded'){
      saveStatus.style.color = 'var(--success)';
    } else if (text === 'Saving...'){
      saveStatus.style.color = 'var(--muted)';
    } else {
      saveStatus.style.color = 'var(--muted)';
    }
  }

  function updateCounts(){
    const text = editor.innerText || '';
    const chars = text.replace(/\n/g,'').length;
    const words = text.trim().length ? text.trim().split(/\s+/).length : 0;
    charCount.textContent = chars + ' chars';
    wordCount.textContent = words + ' words';
  }

  // Toolbar commands (uses execCommand for simplicity)
  function exec(cmd, value=null){
    editor.focus();
    if (cmd === 'h2'){
      document.execCommand('formatBlock', false, 'h2');
    } else if (cmd === 'blockquote'){
      document.execCommand('formatBlock', false, 'blockquote');
    } else if (cmd === 'createLink'){
      const url = prompt('Enter URL (include http:// or https://):', 'https://');
      if (url){
        document.execCommand('createLink', false, url);
      }
    } else {
      document.execCommand(cmd, false, value);
    }
    scheduleAutosave();
    updateCounts();
  }

  // Attach toolbar button listeners
  document.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      exec(btn.getAttribute('data-cmd'));
    });
  });

  // Font size / family
  document.getElementById('fontSize').addEventListener('change', (e)=>{
    editor.style.fontSize = e.target.value || '';
  });
  document.getElementById('fontFamily').addEventListener('change', (e)=>{
    editor.style.fontFamily = e.target.value || '';
  });

  // Undo/redo
  document.getElementById('undo').addEventListener('click', ()=>{
    document.execCommand('undo');
    scheduleAutosave();
  });
  document.getElementById('redo').addEventListener('click', ()=>{
    document.execCommand('redo');
    scheduleAutosave();
  });

  // Insert image
  const imageFile = document.getElementById('imageFile');
  document.getElementById('insertImage').addEventListener('click', ()=> imageFile.click());
  imageFile.addEventListener('change', async (ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const src = reader.result;
      // insert image at caret
      const img = document.createElement('img');
      img.src = src;
      img.style.maxWidth = '100%';
      img.alt = f.name;
      insertNodeAtCaret(img);
      scheduleAutosave();
    };
    reader.readAsDataURL(f);
    ev.target.value = '';
  });

  // helper to insert node at caret
  function insertNodeAtCaret(node){
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) {
      editor.appendChild(node);
      return;
    }
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    // move caret after node
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // Export functions
  function exportHTML(){
    const title = docTitle.value || 'Untitled document';
    const html = `<!doctype html>
<html>
<head><meta charset="utf-8"><title>${escapeHtml(title)}</title></head>
<body>${editor.innerHTML}</body>
</html>`;
    downloadBlob(html, (title.replace(/\s+/g,'_') || 'document') + '.html', 'text/html;charset=utf-8');
  }
  function exportTxt(){
    const title = docTitle.value || 'Untitled document';
    const text = editor.innerText || '';
    downloadBlob(text, (title.replace(/\s+/g,'_') || 'document') + '.txt', 'text/plain;charset=utf-8');
  }

  function downloadBlob(content, filename, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Import
  const importFile = document.getElementById('importFile');
  importFile.addEventListener('change', (ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const content = reader.result;
      if (f.type.includes('html') || f.name.toLowerCase().endsWith('.html') || f.name.toLowerCase().endsWith('.htm')){
        // parse html
        const parser = new DOMParser();
        const doc = parser.parseFromString(content, 'text/html');
        const body = doc.body;
        editor.innerHTML = body.innerHTML;
      } else {
        // treat as plain text
        editor.textContent = content;
      }
      scheduleAutosave();
      updateCounts();
    };
    // read as text because we want to parse html or text
    reader.readAsText(f);
    ev.target.value = '';
  });

  // Clear document
  document.getElementById('clearDoc').addEventListener('click', ()=>{
    if (!confirm('Clear the document? This cannot be undone.')) return;
    docTitle.value = '';
    editor.innerHTML = '';
    scheduleAutosave();
    updateCounts();
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e)=>{
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const mod = isMac ? e.metaKey : e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's'){ // Ctrl/Cmd+S
      e.preventDefault();
      saveToStorage();
      return;
    }
    if (mod && e.key.toLowerCase() === 'e'){ // export HTML
      e.preventDefault();
      exportHTML();
      return;
    }
    if (mod && e.key.toLowerCase() === 't'){ // export TXT
      e.preventDefault();
      exportTxt();
      return;
    }
  });

  // Update counts & schedule autosave on input
  editor.addEventListener('input', ()=>{
    updateCounts();
    scheduleAutosave();
  });
  docTitle.addEventListener('input', scheduleAutosave);

  // Theme toggle
  function loadTheme(){
    const t = localStorage.getItem(LS_THEME) || 'light';
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(LS_THEME, next);
  }
  toggleThemeBtn.addEventListener('click', toggleTheme);

  // Utility: escape HTML for filename insertion
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  // init
  loadTheme();
  loadFromStorage();
  updateSaveStatus('Autosaving');
  // start an interval to show "Autosave on" status
  setTimeout(()=>updateSaveStatus('Autosave on'), 800);

  // expose exports for buttons
  document.getElementById('exportHtml').addEventListener('click', exportHTML);
  document.getElementById('exportTxt').addEventListener('click', exportTxt);

  // initial counts
  updateCounts();

  // Accessibility: ensure editor is focusable with keyboard on load
  editor.setAttribute('tabindex', '0');

  // Make toolbar buttons accessible via keyboard (Enter/Space)
  document.querySelectorAll('.toolbar button, .top-toolbar button, .controls .icon').forEach(btn=>{
    btn.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        btn.click();
      }
    });
  });

})();
</script>
</body>
</html>
</body>
</html>
