    <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple Text Editor</title>
<style>
  :root{
    --bg:#f7f7f8;
    --panel:#ffffff;
    --muted:#666;
    --accent:#2463eb;
    --toolbar:#f0f2f5;
    --border:#e3e6ea;
    --success:#2ea44f;
    --danger:#d73a49;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  [data-theme="dark"]{
    --bg:#0f1113;
    --panel:#111214;
    --muted:#9aa0a6;
    --accent:#5b8cff;
    --toolbar:#121416;
    --border:#202224;
    --success:#38c172;
    --danger:#ff6b6b;
  }

  html,body{height:100%;margin:0;background:var(--bg);color:var(--muted);}
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    gap:18px;
    padding:20px;
    box-sizing:border-box;
  }

  header{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .title-area{
    display:flex;
    gap:12px;
    align-items:center;
    flex:1;
  }
  input.title{
    font-size:18px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:inherit;
    min-width:180px;
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
  }
  .meta{
    display:flex;
    gap:8px;
    align-items:center;
    color:var(--muted);
    font-size:13px;
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
  }

  button.icon{
    background:var(--toolbar);
    border:1px solid var(--border);
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button.icon:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06);}

  .editor-wrap{
    display:flex;
    gap:18px;
    align-items:flex-start;
    width:100%;
  }

  .toolbar{
    flex:0 0 56px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .toolbar button{width:56px;height:56px;padding:8px;border-radius:12px;}

  .editor-panel{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 3px 12px rgba(12,14,16,0.03);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .top-toolbar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    align-items:center;
  }
  .top-toolbar .group{display:flex;gap:6px;align-items:center;}

  .content{
    padding:18px;
    min-height:360px;
    outline:none;
    line-height:1.6;
    color:var(--muted);
    overflow:auto;
  }
  .content:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
    opacity:0.6;
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:auto;
  }

  .status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;}
  .count{font-size:13px;color:var(--muted);}

  /* responsive */
  @media (max-width:760px){
    .toolbar{flex-direction:row;flex:0 0 auto;}
    .toolbar button{width:44px;height:44px;border-radius:10px;}
    .editor-wrap{flex-direction:column;}
  }

  /* small helpers */
  .small{font-size:13px;color:var(--muted)}
  input[type="file"]{display:none}
</style>
</head>
<body/>
